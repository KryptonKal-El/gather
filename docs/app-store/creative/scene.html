<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gather Lists App Store creative</title>
<style>
  @font-face {
    font-family: "Quicksand";
    src: url("../../../public/fonts/quicksand-latin-var.woff2") format("woff2");
    font-weight: 300 700;
  }
  html, body { margin: 0; height: 100%; background: #A5E0BE; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
  .item-text { font-family: "Quicksand", sans-serif; font-weight: 600; font-size: 62px; fill: #2C5C4A; }
  .heart-shadow { filter: drop-shadow(0 1.5px 1.6px rgba(44, 92, 74, 0.3)); }
  .tagline { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 104px; fill: #2C5C4A; text-anchor: middle; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6EED7"/>
      <stop offset="1" stop-color="#A5E0BE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2C5C4A" flood-opacity="0.28"/>
    </filter>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#2C5C4A" flood-opacity="0.35"/>
    </filter>
    <clipPath id="screenClip"><rect x="-372" y="-809" width="744" height="1618" rx="92"/></clipPath>
    <path id="heart" d="M12 21C8 17.5 2 13 2 8.2 2 5.3 4.2 3 7 3c2 0 3.8 1.1 5 2.9C13.2 4.1 15 3 17 3c2.8 0 5 2.3 5 5.2C22 13 16 17.5 12 21Z"/>
  </defs>

  <rect id="backdrop" fill="url(#bg)"/>
  <ellipse id="halo" fill="url(#glow)"/>
  <g id="drift"></g>
  <g id="phones"></g>
  <text id="tagline" class="tagline"></text>
  <g id="rows"></g>
</svg>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";
const LOOP_SECONDS = 8;
const HEART_UNIT = 6.6;
const ITEMS = ["Fresh strawberries", "Birthday candles", "Pack the sunscreen"];
const ROW_Y = [613, 823, 1033];
const UNCHECK_AT = 1.6;
const CHECK_AT = [3.0, 4.0, 5.0];
const SCREENS = ["../screenshots/iphone-6.3/02-grocery-list.png", "../screenshots/iphone-6.3/03-meal-plan.png"];

// Rows are authored around (1920, 823); each layout moves and scales them into its art safe area.
const LAYOUTS = {
  header: {
    width: 3840, height: 1646, rowsY: 823, rowsScale: 1, tagline: null,
    phones: [{ x: 560, y: 1010, scale: 1 }, { x: 3280, y: 1010, scale: 1 }],
  },
  search: {
    width: 3840, height: 2560, rowsY: 1400, rowsScale: 1.2, tagline: { text: "Smart lists for every occasion", y: 960 },
    phones: [{ x: 430, y: 1500, scale: 1.3 }, { x: 3410, y: 1500, scale: 1.3 }],
  },
};
const layout = LAYOUTS[new URLSearchParams(location.search).get("asset") ?? "header"];
const PHONES = layout.phones.map((phone, index) => ({
  ...phone, src: SCREENS[index], tilt: index === 0 ? -8 : 8, phase: index * Math.PI,
}));

const el = (name, attrs = {}, parent) => {
  const node = document.createElementNS(SVG_NS, name);
  Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
  parent?.appendChild(node);
  return node;
};
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const easeOut = (v) => 1 - (1 - v) ** 3;
const easeInOut = (v) => (v < 0.5 ? 4 * v ** 3 : 1 - ((-2 * v + 2) ** 3) / 2);
const mix = (a, b, v) => a + (b - a) * v;
const mixColor = (from, to, v) => `rgb(${from.map((c, i) => Math.round(mix(c, to[i], v))).join(",")})`;

// Deterministic pseudo-random so every render produces the same drift field.
const seeded = (seed) => () => {
  seed = (seed * 16807) % 2147483647;
  return seed / 2147483647;
};

const stage = document.getElementById("stage");
stage.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
Object.entries({ width: layout.width, height: layout.height })
  .forEach(([key, value]) => document.getElementById("backdrop").setAttribute(key, value));
Object.entries({ cx: layout.width / 2, cy: layout.rowsY, rx: 1500, ry: 900 })
  .forEach(([key, value]) => document.getElementById("halo").setAttribute(key, value));
document.getElementById("rows").setAttribute(
  "transform", `translate(1920 ${layout.rowsY}) scale(${layout.rowsScale}) translate(-1920 -823)`,
);
if (layout.tagline) {
  const tagline = document.getElementById("tagline");
  tagline.textContent = layout.tagline.text;
  tagline.setAttribute("x", layout.width / 2);
  tagline.setAttribute("y", layout.tagline.y);
}

const random = seeded(27);
const driftHearts = Array.from({ length: 22 }, () => {
  const node = el("use", { href: "#heart", fill: "#FFFFFF" }, document.getElementById("drift"));
  return {
    node,
    x: random() * 3840,
    offset: random(),
    laps: 1 + Math.floor(random() * 2),
    size: 2.5 + random() * 5,
    sway: 20 + random() * 50,
    opacity: 0.12 + random() * 0.2,
  };
});

const phones = PHONES.map((phone) => {
  const group = el("g", { filter: "url(#phoneShadow)" }, document.getElementById("phones"));
  el("rect", { x: -390, y: -827, width: 780, height: 1654, rx: 110, fill: "#1E2B26" }, group);
  el("image", {
    href: phone.src, x: -372, y: -809, width: 744, height: 1618,
    preserveAspectRatio: "xMidYMid slice", "clip-path": "url(#screenClip)",
  }, group);
  return { ...phone, group };
});

const rows = ITEMS.map((label, index) => {
  const y = ROW_Y[index];
  const group = el("g", {}, document.getElementById("rows"));
  const pill = el("g", { filter: "url(#soft)" }, group);
  el("rect", { x: 1370, y: y - 58, width: 1290, height: 116, rx: 58, fill: "#FFFFFF" }, pill);
  const text = el("text", { x: 1440, y: y + 21, class: "item-text" }, pill);
  text.textContent = label;
  const strike = el("line", {
    x1: 1428, y1: y + 2, x2: 1428, y2: y + 2,
    stroke: "#F9A8C9", "stroke-width": 9, "stroke-linecap": "round",
  }, pill);
  const sparks = Array.from({ length: 6 }, () => el("use", { href: "#heart", fill: "#F9A8C9" }, group));
  const heart = el("g", { class: "heart-shadow" }, group);
  const heartShape = el("use", { href: "#heart" }, heart);
  const check = el("path", {
    d: "M7.6 11.4 L10.9 14.7 L16.6 8.4", fill: "none", stroke: "#FFFFFF", "stroke-width": 2.4,
    "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1,
  }, heart);
  return { y, text, strike, sparks, heart, heartShape, check, pill, index, textWidth: 0 };
});

const heartTransform = (cx, cy, scale) =>
  `translate(${cx} ${cy}) scale(${scale}) translate(-12 -12)`;

/**
 * Draws the frame at `seconds` into the loop. The first and last frames match, so the video loops cleanly.
 */
window.renderAt = (seconds) => {
  const t = ((seconds % LOOP_SECONDS) + LOOP_SECONDS) % LOOP_SECONDS;
  const turn = (t / LOOP_SECONDS) * Math.PI * 2;

  driftHearts.forEach((heart) => {
    const travel = (heart.offset + (t / LOOP_SECONDS) * heart.laps) % 1;
    const y = layout.height + 150 - travel * (layout.height + 300);
    const x = heart.x + Math.sin(turn * heart.laps + heart.offset * 6) * heart.sway;
    const fade = Math.sin(travel * Math.PI);
    heart.node.setAttribute("transform", heartTransform(x, y, heart.size));
    heart.node.setAttribute("opacity", (heart.opacity * fade).toFixed(3));
  });

  phones.forEach((phone) => {
    const bob = Math.sin(turn + phone.phase) * 22;
    const tilt = phone.tilt + Math.sin(turn + phone.phase + 1) * 0.8;
    phone.group.setAttribute("transform", `translate(${phone.x} ${phone.y + bob}) rotate(${tilt}) scale(${phone.scale})`);
  });

  rows.forEach((row) => {
    const unchecking = clamp01((t - UNCHECK_AT - row.index * 0.12) / 0.5);
    const sinceCheck = t - CHECK_AT[row.index];
    const checking = clamp01(sinceCheck / 0.45);
    const checked = sinceCheck >= 0 ? easeOut(checking) : 1 - easeInOut(unchecking);

    const pop = sinceCheck >= 0 && sinceCheck < 0.6 ? Math.sin((sinceCheck / 0.6) * Math.PI) * 0.22 : 0;
    row.heart.setAttribute("transform", heartTransform(1245, row.y, HEART_UNIT * (1 + pop)));
    row.heartShape.setAttribute("fill", mixColor([255, 255, 255], [249, 168, 201], checked));
    row.check.setAttribute("stroke-dashoffset", (1 - checked).toFixed(4));

    row.text.setAttribute("opacity", mix(1, 0.5, checked).toFixed(3));
    row.strike.setAttribute("x2", 1428 + (row.textWidth + 24) * checked);
    row.strike.setAttribute("opacity", checked > 0.01 ? 1 : 0);
    row.pill.setAttribute("transform", `translate(${pop * 40} 0)`);

    const burst = clamp01(sinceCheck / 0.7);
    row.sparks.forEach((spark, i) => {
      const angle = (i / row.sparks.length) * Math.PI * 2 + 0.5;
      const reach = 70 + easeOut(burst) * 95;
      spark.setAttribute("transform", heartTransform(
        1245 + Math.cos(angle) * reach, row.y + Math.sin(angle) * reach, 1.6 * (1 - burst * 0.5),
      ));
      spark.setAttribute("opacity", sinceCheck >= 0 && burst < 1 ? (1 - burst).toFixed(3) : 0);
    });
  });
};

window.sceneReady = document.fonts.ready.then(() => {
  rows.forEach((row) => { row.textWidth = row.text.getComputedTextLength(); });
  window.renderAt(0);
});

if (!navigator.webdriver) {
  const start = performance.now();
  const tick = () => {
    window.renderAt((performance.now() - start) / 1000);
    requestAnimationFrame(tick);
  };
  window.sceneReady.then(tick);
}
</script>
</body>
</html>
